<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>گلوله نخ بگیر</title>
<style>
:root{--bg:#fff4ec;--fg:#4a2c2a;--card:#ffe0cc;--accent:#e4572e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#2a1b1a;--fg:#ffe9dc;--card:#4a2c2a;--accent:#ff8a5c;color-scheme:dark}}
html,body{height:100%;margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:Tahoma,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:manipulation}
header{display:flex;justify-content:space-between;padding:12px 16px;font-size:18px;font-weight:bold}
#field{position:relative;flex:1;overflow:hidden;margin:0 12px 12px;border-radius:16px;background:var(--card)}
.item{position:absolute;font-size:44px;line-height:1;cursor:pointer;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-60px)}to{transform:translateY(110vh)}}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:var(--card)}
button{font:inherit;font-size:18px;padding:12px 28px;border:0;border-radius:24px;background:var(--accent);color:#fff;cursor:pointer}
h1{margin:0;font-size:26px}p{margin:0;line-height:1.8}
</style>
</head>
<body>
<header><span>🧶 امتیاز: <b id="score">0</b></span><span>⏱ <b id="time">30</b></span></header>
<div id="field">
  <div id="panel">
    <h1>🧶 گلوله نخ بگیر!</h1>
    <p>روی گلوله‌های نخ بزن تا امتیاز بگیری.<br>مواظب قیچی ✂️ باش، امتیازت رو کم می‌کنه!</p>
    <button id="start">شروع بازی</button>
  </div>
</div>
<script>
var score=0,left=30,run=false,spawnT,clockT;
var field=document.getElementById('field'),panel=document.getElementById('panel');
var sc=document.getElementById('score'),tm=document.getElementById('time');
function spawn(){
  if(!run)return;
  var bad=Math.random()<0.22, gold=!bad&&Math.random()<0.1;
  var el=document.createElement('div');
  el.className='item';
  el.textContent=bad?'✂️':(gold?'🌟':'🧶');
  el.style.left=Math.random()*(field.clientWidth-56)+'px';
  el.style.animationDuration=(2.2+Math.random()*1.6)+'s';
  var hit=function(e){
    e.preventDefault();
    if(!run||el.dataset.done)return;
    el.dataset.done=1;
    score=Math.max(0,score+(bad?-3:(gold?5:1)));
    sc.textContent=score;
    el.textContent='✨';
    setTimeout(function(){el.remove()},150);
  };
  el.addEventListener('pointerdown',hit);
  el.addEventListener('animationend',function(){el.remove()});
  field.appendChild(el);
  spawnT=setTimeout(spawn,420+Math.random()*300);
}
function rank(s){
  if(s>=45)return '👑 ملکه‌ی نخ';
  if(s>=30)return '🧵 استاد حلقه';
  if(s>=15)return '🧶 کاشف نخ';
  return '🐣 تازه‌کار';
}
function end(){
  run=false;clearTimeout(spawnT);clearInterval(clockT);
  document.querySelectorAll('.item').forEach(function(n){n.remove()});
  panel.style.display='flex';
  panel.innerHTML='<h1>تموم شد!</h1><p>امتیاز تو: <b>'+score+'</b><br>'+rank(score)+'</p><p>اسکرین‌شات بگیر و توی کانال بفرست 📸</p><button id="again">دوباره</button>';
  document.getElementById('again').onclick=begin;
}
function begin(){
  score=0;left=30;sc.textContent=0;tm.textContent=30;
  panel.style.display='none';run=true;spawn();
  clockT=setInterval(function(){left--;tm.textContent=left;if(left<=0)end()},1000);
}
document.getElementById('start').onclick=begin;
</script>
</body>
</html>
