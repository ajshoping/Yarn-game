<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>گلوله نخ بگیر</title>
<style>
:root{--bg:#fff4ec;--fg:#4a2c2a;--card:#ffe3d1;--card2:#fff;--accent:#e4572e;--bar:#ffb03b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#241716;--fg:#ffe9dc;--card:#3a2422;--card2:#4a2c2a;--accent:#ff8a5c;--bar:#ffb03b;color-scheme:dark}}
html,body{height:100%;margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:Tahoma,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:manipulation}
header{display:flex;gap:10px;padding:12px 14px 6px}
.chip{flex:1;background:var(--card2);border-radius:16px;padding:8px 12px;text-align:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.chip b{display:block;font-size:24px;line-height:1.2}
#bar{height:8px;margin:4px 14px 8px;border-radius:8px;background:var(--card);overflow:hidden}
#fill{height:100%;width:100%;background:var(--bar);border-radius:8px;transition:width 1s linear}
#field{position:relative;flex:1;overflow:hidden;margin:0 12px 12px;border-radius:20px;background:var(--card)}
.item{position:absolute;width:84px;height:84px;display:flex;align-items:center;justify-content:center;font-size:62px;line-height:1;cursor:pointer;animation:fall linear forwards;filter:drop-shadow(0 4px 4px rgba(0,0,0,.18))}
@keyframes fall{from{transform:translateY(-100px)}to{transform:translateY(115vh)}}
.pop{animation:pop .3s ease-out forwards!important}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
.plus{position:absolute;font-size:26px;font-weight:bold;pointer-events:none;animation:up .8s ease-out forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
#combo{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:20px;font-weight:bold;color:var(--accent);pointer-events:none;opacity:0;transition:opacity .2s}
#panel{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:var(--card)}
button{font:inherit;font-size:20px;padding:14px 36px;border:0;border-radius:28px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
h1{margin:0;font-size:28px}p{margin:0;line-height:1.9;font-size:16px}
.big{font-size:56px;line-height:1}
</style>
</head>
<body>
<header>
  <div class="chip">🧶 امتیاز<b id="score">0</b></div>
  <div class="chip">⏱ زمان<b id="time">30</b></div>
</header>
<div id="bar"><div id="fill"></div></div>
<div id="field">
  <div id="combo"></div>
  <div id="panel">
    <div class="big">🧶</div>
    <h1>گلوله نخ بگیر!</h1>
    <p>روی گلوله‌های نخ بزن تا امتیاز بگیری 🧶<br>ستاره 🌟 پنج امتیاز داره<br>پشت‌سرهم بزنی امتیاز بونوس می‌گیری 🔥<br>مواظب قیچی ✂️ باش!</p>
    <button id="start">شروع بازی</button>
  </div>
</div>
<script>
var score=0,left=30,run=false,streak=0,spawnT,clockT;
var field=document.getElementById('field'),panel=document.getElementById('panel');
var sc=document.getElementById('score'),tm=document.getElementById('time'),fill=document.getElementById('fill'),combo=document.getElementById('combo');
function buzz(){try{if(navigator.vibrate)navigator.vibrate(15)}catch(e){}}
function floatText(x,y,t,c){
  var p=document.createElement('div');p.className='plus';p.textContent=t;p.style.left=x+'px';p.style.top=y+'px';p.style.color=c;
  field.appendChild(p);setTimeout(function(){p.remove()},800);
}
function showCombo(){
  if(streak>=3){combo.textContent='🔥 '+streak+' تا پشت‌سرهم!';combo.style.opacity=1}else{combo.style.opacity=0}
}
function speed(){return 1-0.6((30-left)/30)}
function spawn(){
  if(!run)return;
  var bad=Math.random()<0.14,gold=!bad&&Math.random()<0.12;
  var el=document.createElement('div');
  el.className='item';
  el.textContent=bad?'✂️':(gold?'🌟':'🧶');
  el.style.left=Math.random()(field.clientWidth-84)+'px';
  el.style.animationDuration=((3.4+Math.random()1.6)speed())+'s';
  el.addEventListener('pointerdown',function(e){
    e.preventDefault();
    if(!run||el.dataset.done)return;
    el.dataset.done=1;
    var r=el.getBoundingClientRect(),f=field.getBoundingClientRect();
    var x=r.left-f.left+20,y=r.top-f.top;
    var pts;
    if(bad){pts=-2;streak=0;floatText(x,y,'-2','#d00')}
    else{
      streak++;pts=gold?5:1;
      if(streak%5===0){pts+=2;floatText(x,y-30,'🔥 بونوس +2','#e4572e')}
      floatText(x,y,'+'+(gold?5:1),'#2a9d4a');
    }
    score=Math.max(0,score+pts);sc.textContent=score;showCombo();buzz();
    el.style.animation='none';el.offsetHeight;
    var t=el.style.transform;
    el.className='item pop';
    setTimeout(function(){el.remove()},300);
  });
  el.addEventListener('animationend',function(e){if(e.animationName==='fall'){if(!bad&&!el.dataset.done){streak=0;showCombo()}el.remove()}});
  field.appendChild(el);
  spawnT=setTimeout(spawn,(380+Math.random()260)speed());
}
function rank(s){
  if(s>=60)return '👑 ملکه‌ی نخ';
  if(s>=40)return '🧵 استاد حلقه';
  if(s>=20)return '🧶 کاشف نخ';
  return '🐣 تازه‌کار';
}
function end(){
  run=false;clearTimeout(spawnT);clearInterval(clockT);
  document.querySelectorAll('.item').forEach(function(n){n.remove()});
  combo.style.opacity=0;
  panel.style.display='flex';
  panel.innerHTML='<div class="big">🎉</div><h1>تموم شد!</h1><p>امتیاز تو: <b style="font-size:32px">'+score+'</b><br>'+rank(score)+'</p><p>اسکرین‌شات بگیر و توی کانال بفرست 📸</p><button id="again">دوباره بازی کن</button>';
  document.getElementById('again').onclick=begin;
}
function begin(){
  score=0;left=30;streak=0;sc.textContent=0;tm.textContent=30;fill.style.width='100%';
  panel.style.display='none';run=true;spawn();
  clockT=setInterval(function(){left--;tm.textContent=left;fill.style.width=(left/30*100)+'%';if(left<=0)end()},1000);
}
document.getElementById('start').onclick=begin;
</script>
</body>
</html>
